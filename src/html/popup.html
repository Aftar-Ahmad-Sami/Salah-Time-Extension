<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salah Times</title>
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <div class="dates">
        <div id="gregorianDate" class="date-main">&nbsp;</div>
        <div id="hijriDate" class="date-sub">&nbsp;</div>
      </div>
      <div class="hero-actions">
        <button id="refreshBtn" class="icon-btn" type="button" title="Refresh" aria-label="Refresh location and prayer times">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <div class="next">
      <div class="next-label">Next prayer</div>
      <div class="next-name">
        <span id="nextName">—</span>
        <span id="nextArabic" class="ar" lang="ar"></span>
        <span id="nextTime" class="next-at"></span>
      </div>
      <div id="countdown" class="countdown">--:--:--</div>
    </div>

    <div class="location-pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="locationName">Locating…</span>
    </div>
  </header>

  <main>
    <section id="status" class="status" hidden>
      <p id="statusTitle" class="status-title"></p>
      <p id="statusMessage" class="status-message"></p>
      <div class="status-actions">
        <button id="retryBtn" class="btn" type="button">Try again</button>
        <button id="manualBtn" class="btn btn-ghost" type="button">Set location manually</button>
      </div>
    </section>

    <ul id="prayerList" class="prayer-list" aria-label="Today's prayer times"></ul>

    <section class="extras">
      <div class="tile qibla-tile">
        <svg class="compass" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="compass-ring" cx="32" cy="32" r="29"/>
          <path class="compass-ticks" d="M32 5v4M32 55v4M5 32h4M55 32h4"/>
          <text class="compass-n" x="32" y="17" text-anchor="middle">N</text>
          <g id="qiblaNeedle" class="needle">
            <path class="needle-head" d="M32 10 L36.5 32 L32 29 L27.5 32 Z"/>
            <rect class="needle-kaaba" x="29.5" y="6" width="5" height="5" rx="0.8"/>
            <circle class="needle-pin" cx="32" cy="32" r="2.6"/>
          </g>
        </svg>
        <div class="tile-body">
          <div class="tile-label">Qibla</div>
          <div id="qiblaBearing" class="tile-value">—</div>
          <div id="qiblaDistance" class="tile-sub">&nbsp;</div>
        </div>
      </div>

      <div class="tile night-tile">
        <div class="tile-label">Night</div>
        <dl class="night-list">
          <div><dt>Imsak</dt><dd id="imsakTime">—</dd></div>
          <div><dt>Midnight</dt><dd id="midnightTime">—</dd></div>
          <div><dt>Last third</dt><dd id="lastThirdTime">—</dd></div>
        </dl>
      </div>
    </section>

    <footer class="footer">
      <span id="methodName">&nbsp;</span>
    </footer>
  </main>

  <section id="settings" class="sheet" hidden aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <button id="closeSettings" class="icon-btn icon-btn-plain" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="settingsTitle">Settings</h2>
    </div>

    <div class="sheet-body">
      <div class="field">
        <label class="field-label" for="methodSelect">Calculation method</label>
        <select id="methodSelect"></select>
      </div>

      <div class="field">
        <span class="field-label" id="schoolLabel">Asr calculation</span>
        <div class="segmented" role="radiogroup" aria-labelledby="schoolLabel">
          <label><input type="radio" name="school" value="0"><span>Standard</span></label>
          <label><input type="radio" name="school" value="1"><span>Hanafi</span></label>
        </div>
        <p class="hint">Standard: Shafiʿi, Maliki, Hanbali. Hanafi gives a later Asr time.</p>
      </div>

      <div class="field">
        <span class="field-label" id="clockLabel">Time format</span>
        <div class="segmented" role="radiogroup" aria-labelledby="clockLabel">
          <label><input type="radio" name="clock" value="12"><span>12-hour</span></label>
          <label><input type="radio" name="clock" value="24"><span>24-hour</span></label>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="cityInput">Location</label>
        <p id="locationMode" class="hint"></p>
        <form id="cityForm" class="city-form">
          <input id="cityInput" type="text" placeholder="Search a city, e.g. Istanbul" autocomplete="off">
          <button class="btn" type="submit">Set</button>
        </form>
        <p id="cityError" class="hint hint-error" hidden></p>
        <button id="useDeviceBtn" class="link-btn" type="button" hidden>Use my device location instead</button>
      </div>
    </div>
  </section>

  <script src="../js/popup.js"></script>
</body>
</html>
